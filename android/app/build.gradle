plugins {
    id 'com.android.application'
}

// ⚙️ Endereço do app na web (o mesmo do GitHub Pages). Mude aqui se publicar em outro lugar.
def webHost = 'ragzonte.github.io'
def webPath = '/trabalho_rh/'

// Assinatura: o workflow do GitHub passa a chave por variáveis de ambiente.
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'io.github.ragzonte.contasadois'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ragzonte.contasadois'
        minSdk 21
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"

        manifestPlaceholders = [
            hostName  : webHost,
            pathPrefix: webPath.replaceAll('/$', ''),
        ]
        resValue 'string', 'launchUrl', "https://${webHost}${webPath}?origem=android"
        resValue 'string', 'webManifestUrl', "https://${webHost}${webPath}manifest.webmanifest"
        resValue 'string', 'providerAuthority', 'io.github.ragzonte.contasadois.fileprovider'
        // Liga o app ao site (Digital Asset Links): sem barra de endereço e abrindo os links de convite.
        resValue 'string', 'assetStatements',
            '[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], ' +
            '\\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + webHost + '\\"}}]'
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'contasadois'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    // Abre o app web em tela cheia usando o Chrome do celular (Trusted Web Activity).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
