plugins {
    id 'com.android.application'
}

// O app web (index.html, js, css...) vai inteiro dentro do APK: não precisa de site.
def webAssetsDir = layout.buildDirectory.dir('generated/web').get().asFile
def copyWeb = tasks.register('copyWeb', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'icons/**', 'apps-script/**'
    }
    into new File(webAssetsDir, 'www')
}
tasks.named('preBuild') { dependsOn copyWeb }

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.contasadois.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.contasadois.app'
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "2.0.${buildNumber}"
    }

    // Assinatura: o workflow do GitHub passa a chave por variáveis de ambiente
    // (nunca deixe a chave no repositório).
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'contasadois'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            assets.srcDirs += [webAssetsDir]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
