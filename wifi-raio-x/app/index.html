<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- A página não fala com ninguém de fora: o que usa a internet (teste de velocidade e de latência,
         só quando o usuário pede) é feito pelo lado nativo do app, não por esta página. Por isso a
         política só libera o que vem do próprio app: nenhum endereço externo, nenhum formulário
         enviado, e o único Worker é o arquivo js/mapping/worker.js (nada de blob:). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <title>WiFi Raio-X</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0f1c'/%3E%3Cg fill='none' stroke='%2338bdf8' stroke-width='1.9' stroke-linecap='round'%3E%3Cpath d='M4.5 10.2a11 11 0 0 1 15 0'/%3E%3Cpath d='M7.6 13.4a6.6 6.6 0 0 1 8.8 0'/%3E%3C/g%3E%3Ccircle cx='12' cy='17' r='1.5' fill='%2338bdf8'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- O app inteiro é montado por js/main.js; isto é só a tela de abertura. -->
    <div id="splash" class="splash" role="status">
      <svg class="splash__logo" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 9.2a13.6 13.6 0 0 1 19 0" opacity="0.45" />
        <path d="M5.6 12.5a9.2 9.2 0 0 1 12.8 0" opacity="0.7" />
        <path d="M8.7 15.7a4.8 4.8 0 0 1 6.6 0" />
        <circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none" />
      </svg>
      <span>WiFi Raio-X</span>
    </div>
    <div id="app" class="app" hidden></div>
    <noscript>O WiFi Raio-X precisa de JavaScript para funcionar.</noscript>
  </body>
</html>
