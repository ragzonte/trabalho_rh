<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- a mesma política do app: o visualizador tem de funcionar dentro dela -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mapa 3D · demonstração do visualizador</title>
    <link rel="stylesheet" href="../../../app/css/app.css" />
    <link rel="stylesheet" href="../../../app/css/map-viewer.css" />
    <style>
      /* Página de testes: não vai para o app. */
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
      }
      #panel {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        max-height: 42%;
        overflow: auto;
        padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--line);
        background: var(--surface);
        font-size: 13px;
      }
      #panel[hidden] {
        display: none;
      }
      #panel label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 32px;
        color: var(--muted);
        white-space: nowrap;
      }
      #panel select,
      #panel button,
      #panel input[type='range'] {
        min-height: 32px;
        padding: 2px 8px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--text);
      }
      #panel input[type='range'] {
        width: 90px;
        padding: 0;
      }
      #panel fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
        margin: 0;
        padding: 0;
        border: 0;
      }
      #status {
        flex-basis: 100%;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <form id="panel" autocomplete="off">
      <label>Mundo <select id="world"></select></label>
      <label>Cor <select id="heat"></select></label>
      <label>Vista
        <select id="view">
          <option value="orbit">órbita</option>
          <option value="top">de cima</option>
        </select>
      </label>
      <label>Tema
        <select id="theme">
          <option value="dark">escuro</option>
          <option value="light">claro</option>
        </select>
      </label>
      <label>Foco <select id="focus"></select></label>
      <label>Nomes
        <select id="labels">
          <option value="normal">normais</option>
          <option value="hostile">longos, emoji e hostis</option>
        </select>
      </label>
      <label>Afastar <input id="explode" type="range" min="0" max="1" step="0.05" value="0" /></label>
      <label>Progresso <input id="progress" type="range" min="0.1" max="1" step="0.05" value="1" /></label>
      <fieldset id="layers"></fieldset>
      <button type="button" id="walk">Caminhar</button>
      <button type="button" id="reset">Reenquadrar</button>
      <button type="button" id="shot">Foto</button>
      <div id="status" role="status"></div>
    </form>
    <script type="module" src="./viewer-demo.js"></script>
  </body>
</html>
