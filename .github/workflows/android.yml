# Compila o app Android (APK). Na branch principal do repositório, publica em:
# https://github.com/ragzonte/trabalho_rh/releases/download/android/contas-a-dois.apk
name: App Android

on:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'apps-script/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/app.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
            echo "::notice::APK assinado com a chave fixa (secret ANDROID_KEYSTORE_BASE64)."
          else
            # Sem a secret: chave temporária. O APK funciona, mas para instalar uma
            # versão nova é preciso desinstalar a anterior (veja o README).
            PASS="tmp$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -alias contasadois -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Contas a Dois"
            echo "::warning::APK assinado com chave temporária. Configure a secret ANDROID_KEYSTORE_BASE64 para as atualizações instalarem por cima."
          fi
          echo "::add-mask::$PASS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Conferir APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/contas-a-dois.apk
          unzip -l out/contas-a-dois.apk | grep -E "assets/www/(index.html|js/app.js|apps-script/Codigo.gs)"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: contas-a-dois-android
          path: out/

      - name: Publicar em Releases
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Baixe **contas-a-dois.apk** no celular Android e toque para instalar (permita instalar apps desta fonte quando o Android pedir). Depois é só colar o link da planilha do casal."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "App Android" --notes "$NOTES"
            gh release delete-asset android assetlinks.json -y 2>/dev/null || true
          else
            gh release create android --title "App Android" --notes "$NOTES"
          fi
          gh release upload android out/contas-a-dois.apk --clobber
