# Compila o app Android (APK) e, na branch main, publica em Releases:
# https://github.com/ragzonte/trabalho_rh/releases/download/android/contas-a-dois.apk
name: App Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/app.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
            echo "KEY_KIND=fixa (secret ANDROID_KEYSTORE_BASE64)" >> "$GITHUB_ENV"
          else
            # Sem a secret, usa uma chave temporária: o APK funciona, mas cada versão
            # precisa de desinstalar a anterior e o app mostra a barra de endereço.
            PASS="tmp$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -alias contasadois -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Contas a Dois"
            echo "KEY_KIND=temporária (configure a secret para fixar)" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$PASS"
          FP=$(keytool -list -v -keystore "$KS" -alias contasadois -storepass "$PASS" | grep -m1 'SHA256:' | awk '{print $2}')
          {
            echo "ANDROID_KEYSTORE_PATH=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "FINGERPRINT=$FP"
          } >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivos
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk out/contas-a-dois.apk
          printf '[{\n  "relation": ["delegate_permission/common.handle_all_urls"],\n  "target": {\n    "namespace": "android_app",\n    "package_name": "io.github.ragzonte.contasadois",\n    "sha256_cert_fingerprints": ["%s"]\n  }\n}]\n' "$FINGERPRINT" > out/assetlinks.json
          {
            echo "### 📱 App Android"
            echo ""
            echo "- Chave de assinatura: **$KEY_KIND**"
            echo "- Impressão digital SHA-256: \`$FINGERPRINT\`"
            echo ""
            echo "Conteúdo para \`https://ragzonte.github.io/.well-known/assetlinks.json\`:"
            echo '```json'
            cat out/assetlinks.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: contas-a-dois-android
          path: out/

      - name: Publicar em Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --title "App Android" --notes "Baixe **contas-a-dois.apk** no celular Android e toque para instalar (permita instalar de fontes desconhecidas quando o Android pedir). O app se atualiza sozinho quando o site é atualizado; só baixe de novo se o README pedir."
          fi
          gh release upload android out/contas-a-dois.apk out/assetlinks.json --clobber
