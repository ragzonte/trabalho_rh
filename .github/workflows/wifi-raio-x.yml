# Testa e compila o WiFi Raio-X (app Android de análise de Wi-Fi). Na branch principal, publica em:
# https://github.com/ragzonte/trabalho_rh/releases/download/wifi-raio-x/wifi-raio-x.apk
name: WiFi Raio-X

on:
  push:
    paths:
      - 'wifi-raio-x/**'
      - '.github/workflows/wifi-raio-x.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-raio-x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes da interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wifi-raio-x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências de desenvolvimento
        run: npm ci
      - name: Testes de unidade
        run: npm test
      - name: Testes ponta a ponta (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:e2e

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/app.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
            echo "::notice::APK assinado com a chave fixa (secret ANDROID_KEYSTORE_BASE64)."
          else
            # Sem a secret: chave temporária. O APK funciona, mas para instalar uma
            # versão nova é preciso desinstalar a anterior (veja o README).
            PASS="tmp$(openssl rand -hex 12)"
            keytool -genkeypair -keystore "$KS" -alias contasadois -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=WiFi Raio-X"
            echo "::warning::APK assinado com chave temporária. Configure a secret ANDROID_KEYSTORE_BASE64 para as atualizações instalarem por cima."
          fi
          echo "::add-mask::$PASS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Testes do lado nativo e lint
        working-directory: wifi-raio-x/android
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      # O teste de velocidade do app usa speed.cloudflare.com. Aqui ele roda contra o serviço de
      # verdade, com poucos dados. É informativo: uma falha de rede do GitHub não deve barrar o APK.
      - name: Teste de velocidade contra o serviço real (informativo)
        continue-on-error: true
        working-directory: wifi-raio-x/android
        env:
          WRX_LIVE_SPEED: '1'
        run: |
          curl -sS -o /dev/null -D - "https://speed.cloudflare.com/__down?bytes=100000" | grep -iE "^HTTP|content-length|cf-meta|server-timing" || true
          head -c 50000 /dev/urandom | curl -sS -o /dev/null -w "upload: HTTP %{http_code}\n" -X POST --data-binary @- "https://speed.cloudflare.com/__up"
          ./gradlew testDebugUnitTest --tests '*SpeedLiveTest*' --no-daemon -i | grep -E "teste de velocidade ao vivo|SpeedLiveTest|BUILD|FAILED|PASSED" || true
          ./gradlew testDebugUnitTest --tests '*SpeedLiveTest*' --no-daemon -q

      - name: Compilar APK
        working-directory: wifi-raio-x/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Conferir APK
        run: |
          mkdir out
          cp wifi-raio-x/android/app/build/outputs/apk/release/app-release.apk out/wifi-raio-x.apk
          unzip -l out/wifi-raio-x.apk | grep -E "assets/www/(index.html|js/main.js|js/mapping/solver.js|vendor/three.min.js|assets/oui.json)"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-raio-x-android
          path: out/

      - name: Publicar em Releases
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Baixe **wifi-raio-x.apk** no celular Android e toque para instalar (permita instalar apps desta fonte quando o Android pedir)."
          if gh release view wifi-raio-x >/dev/null 2>&1; then
            gh release edit wifi-raio-x --title "WiFi Raio-X" --notes "$NOTES"
          else
            gh release create wifi-raio-x --title "WiFi Raio-X" --notes "$NOTES"
          fi
          gh release upload wifi-raio-x out/wifi-raio-x.apk --clobber
