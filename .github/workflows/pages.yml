# Publica o app no GitHub Pages a cada push na branch principal do repositório.
# Antes da primeira vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages ainda não está ativado. Vá em Settings → Pages → Source: GitHub Actions e rode este workflow de novo (Actions → Publicar no GitHub Pages → Run workflow)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          # Nova versão do cache a cada publicação: os celulares pegam a atualização sozinhos.
          sed -i "s/const VERSION = 'dev';/const VERSION = '${GITHUB_SHA::8}';/" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
